# A reference Magnesium gateway: the namespace's one published entry point
# (goal 25, D57). You bootstrap it once; Magnesium manages it afterwards.
# Same image as the spokes. Fill in what README.md lists: the node, the image
# and the deploy identity's name. Nothing here is a real site.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: magnesium-gateway-home
  labels:
    app.kubernetes.io/name: magnesium-gateway
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: magnesium-gateway
  labels:
    app.kubernetes.io/name: magnesium-gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: magnesium-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: magnesium-gateway
    spec:
      # The namespace's deploy identity, for deploying spokes (being built).
      serviceAccountName: magnesium-gateway
      automountServiceAccountToken: true
      hostname: gateway
      nodeSelector:
        kubernetes.io/hostname: example-node
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: magnesium
          image: magnesium:0000000000
          # Loaded onto the node, never pulled; drop this for an image from a registry.
          imagePullPolicy: Never
          env:
            - name: HOME
              value: /home/magnesium
            - name: MAGNESIUM_ROLE
              value: gateway
            - name: MAGNESIUM_MACHINE
              value: gateway
            # Where it runs, which Fleet shows beside its name: its node, or a
            # description you write.
            - name: MAGNESIUM_NODE
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # The image a spoke's build runs, as you name your images.
            - name: MAGNESIUM_SPOKE_IMAGE
              value: magnesium:{build}
          # A one-time code the hub pairs with: MAGNESIUM_HUB_PAIRING_CODE.
          envFrom:
            - secretRef:
                name: magnesium-gateway
                optional: true
          ports:
            - name: http
              containerPort: 3773
          startupProbe:
            httpGet: { path: /.well-known/t3/environment, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /.well-known/t3/environment, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /.well-known/t3/environment, port: http }
            periodSeconds: 20
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
          volumeMounts:
            - name: home
              mountPath: /home/magnesium
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: magnesium-gateway-home
        - name: tmp
          emptyDir: {}
---
# Publish this one, to the hub alone. Spokes stay unpublished behind it.
apiVersion: v1
kind: Service
metadata:
  name: magnesium-gateway
  labels:
    app.kubernetes.io/name: magnesium-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: magnesium-gateway
  ports:
    - name: http
      port: 3773
      targetPort: http
