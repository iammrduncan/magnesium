# OpenCode {{ magnesium_opencode_version }} per user, pointed at an LLM gateway (D36).
# The API key reaches OpenCode by name: the unit loads it from a secret env file,
# and opencode.json reads {env:NAME}. It never appears in settings, argv or logs.
- name: The gateway, its models, and the LiteLLM key's env file are set
  ansible.builtin.assert:
    that:
      - magnesium_opencode_base_url | length > 0
      - magnesium_secret_env_files | length > 0
      - magnesium_opencode_models | length > 0
    fail_msg: "Set magnesium_opencode_base_url, magnesium_secret_env_files (holding {{ magnesium_opencode_api_key_env }}) and magnesium_opencode_models."

- name: Installed OpenCode version
  ansible.builtin.command: "{{ magnesium_root }}/opencode/bin/opencode --version"
  register: magnesium_opencode_installed
  changed_when: false
  failed_when: false
  check_mode: false

# 2.x says "opencode v2.0.32"; the version is the number in it. 2.x's first run
# converts OpenCode's own database in place, as moving off 1.x needs (D69).
- name: Install OpenCode {{ magnesium_opencode_version }}
  when: >-
    (magnesium_opencode_installed.stdout | default('') | regex_search('[0-9]+[.][0-9]+[.][0-9]+') | default('', true))
    != magnesium_opencode_version and not ansible_check_mode
  block:
    - name: A clean folder for OpenCode
      ansible.builtin.file:
        path: "{{ magnesium_root }}/opencode"
        state: absent
    - name: Folder for OpenCode
      ansible.builtin.file:
        path: "{{ magnesium_root }}/opencode"
        state: directory
        mode: "0755"
    - name: Download OpenCode
      ansible.builtin.get_url:
        url: "https://registry.npmjs.org/@opencode/cli-linux-{{ magnesium_arch }}/-/cli-linux-{{ magnesium_arch }}-{{ magnesium_opencode_version }}.tgz"
        dest: "{{ magnesium_root }}/opencode-{{ magnesium_opencode_version }}.tgz"
        checksum: "sha512:{{ magnesium_opencode_sha512[magnesium_arch] }}"
        mode: "0644"
    - name: Unpack OpenCode
      ansible.builtin.unarchive:
        src: "{{ magnesium_root }}/opencode-{{ magnesium_opencode_version }}.tgz"
        dest: "{{ magnesium_root }}/opencode"
        remote_src: true
        extra_opts: ["--strip-components=1"]
    - name: Remove the download
      ansible.builtin.file:
        path: "{{ magnesium_root }}/opencode-{{ magnesium_opencode_version }}.tgz"
        state: absent

- name: OpenCode on the unit's PATH
  ansible.builtin.file:
    src: "{{ magnesium_root }}/opencode/bin/opencode"
    dest: "{{ ansible_env.HOME }}/.local/bin/opencode"
    state: link
    force: true

- name: Folder for OpenCode's config
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/opencode"
    state: directory
    mode: "0700"

- name: OpenCode's config (the LiteLLM provider; the key by name)
  ansible.builtin.template:
    src: opencode.json.j2
    dest: "{{ ansible_env.HOME }}/.config/opencode/opencode.json"
    mode: "0600"
    backup: true
