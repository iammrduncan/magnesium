# Magnesium server as a systemd user service for the agent user (D15, D35).
# The unit (magnesium/deploy/systemd/magnesium.service) fixes the layout:
# releases under ~/.local/share/magnesium, state in ~/.magnesium.

# The Magnesium source to build from, and the ref to build. Pin a tag or commit.
magnesium_source: https://github.com/iammrduncan/magnesium.git
magnesium_version: main

# Hosts that don't build (a small hub, say) name a build host from the
# inventory. The role builds and packs there, and copies the pack in through
# the admin machine. The pack is the server and its runtime dependencies only.
magnesium_build_host: ""
magnesium_pack_cache: "{{ playbook_dir }}/.packs"

# Node 24, installed per user. Checksums from nodejs.org's SHASUMS256.txt.
magnesium_node_version: "24.22.1"
magnesium_node_sha256:
  x64: 6c172a9ab6718f7b801fb5a7bd486af2ee5e32758086a04b84fcce2aa77095e6
  arm64: dbabf7a1cbf947e6059ffad2c27b80041db97dea1e553b62afdee7f13fca336e

# Bind address and port. On a machine, the address the hub reaches its server
# on: a LAN address, a tailnet address, or 0.0.0.0 behind a firewall that admits
# only the hub (README, "Only the hub reaches a machine"). On the hub, where your
# devices reach it: 127.0.0.1 behind a reverse proxy or a Tailscale Service, or a
# LAN address. Empty: the machine's tailnet IPv4 when Tailscale is installed;
# otherwise the role stops and asks for it.
magnesium_host: ""
magnesium_port: 3773

# Linux: keep the user's systemd running when nobody is logged in (needs root once).
magnesium_enable_linger: false

# The name the hub knows this server by (its machine list); empty uses the inventory
# name. Set it to `hub` on the hub. Profiles name machines by it.
magnesium_machine_name: ""

# The time zone the server keeps, such as Europe/Berlin. Scheduled tasks run at
# their times in it, so set the same one for every server, Kubernetes ones too
# (MAGNESIUM_TIMEZONE), and a task's 09:00 means one time everywhere (D64). Empty:
# the machine's own zone.
magnesium_timezone: ""

# Agents run fenced by default and need nothing for it (goal 03). The optional
# container sandbox needs rootless Podman and a base image pinned by digest;
# empty leaves it off. Profiles' CLIs are mounted from the host, read-only.
magnesium_sandbox_image: "" # docker.io/library/node@sha256:<index digest>

# Env files holding secrets, loaded by the unit by name (D36).
# This role never writes or reads them; it stops if one is missing or not private.
magnesium_secret_env_files: [] # ["{{ ansible_env.HOME }}/.config/magnesium/litellm.env"]

# Settings written once, when the state home has none. Empty: the release's seed
# (magnesium/deploy/seed/settings.json) is written on first activate instead.
magnesium_settings: {}

# OpenCode through an LLM gateway (LiteLLM or another OpenAI-compatible one),
# for machines without Claude Code (D36). OpenCode 2.x only (D69), from its npm
# package for each platform; the sums are the registry's published sha512.
# 2.1.4, not older: 2.0.x bundles a Bun whose Brotli decoder has CVE-2026-111497, and
# 2.0.28 ignores a config's `instructions`, which hold a profile's rules.
magnesium_opencode: false
magnesium_opencode_version: "2.1.4"
magnesium_opencode_sha512:
  x64: a3c109d19b13e1dcc328dfb49a91b610a6cd1b3272a7e175fbe02fdbc51179155f884bfe377e1e6449cdfee9e488ca1eaca1da77a5ba222ee4e2e9139cf36635
  arm64: 76bc342d6306d2789a13de1e3d79b587baa314165945c4990f781a72dde1c773983d77aca7bc6b3add1b9f7b2271835437a7e88c446b0ca47a8d8ad79995feac
magnesium_opencode_base_url: "" # https://llm-gateway.example.com/v1
magnesium_opencode_models: [] # ["<model>"]; the first is the default
magnesium_opencode_api_key_env: LITELLM_API_KEY
