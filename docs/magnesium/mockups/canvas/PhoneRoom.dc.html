<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Room on the phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.ph{--screen:#fcfcfc;--card:#ffffff;--fg:#27272a;--fg-strong:#18181b;--muted:#71717b;--subtle:#a1a1aa;--border:#e4e4e7;--hover:#f4f4f5;--primary:#1b4ed8;--primary-wash:#eef2ff;--on-primary:#ffffff;--warn:#b45309;--warn-wash:#fffbeb;--info:#2563eb;--ok:#15803d;--err:#dc2626;--glass:rgba(252,252,252,.86);--shadow:0 8px 28px rgba(0,0,0,.10);color-scheme:light}
.ph.dark{--screen:#0a0a0a;--card:#111111;--fg:#f5f5f5;--fg-strong:#ffffff;--muted:#8a8a8a;--subtle:#5c5c5c;--border:#1f1f1f;--hover:#161616;--primary:#346bf1;--primary-wash:#0f1a33;--on-primary:#ffffff;--warn:#fbbf24;--warn-wash:#1f1705;--info:#60a5fa;--ok:#4ade80;--err:#f87171;--glass:rgba(10,10,10,.86);--shadow:0 8px 28px rgba(0,0,0,.6);color-scheme:dark}
.ph button{font:inherit;color:inherit;cursor:pointer}
.ph :focus-visible{outline:2px solid var(--primary);outline-offset:2px}
</style>
</helmet>
<div class="ph {{themeClass}}" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: var(--screen); color: var(--fg); font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 1.45">

  <div style="position: absolute; left: 0; right: 0; top: 0; z-index: 2; padding: 50px 8px 8px; display: flex; align-items: center; gap: 4px; background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid var(--border)">
    <a href="Phone.dc.html" aria-label="Back to Home" style="width: 44px; height: 44px; display: grid; place-items: center; color: var(--primary)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>
    </a>
    <div style="flex: 1; min-width: 0; text-align: center">
      <div style="font-size: 16px; font-weight: 700; color: var(--fg-strong)"># serving-plan</div>
      <div style="font-size: 12px; color: var(--muted)">3 bots · lead serving · {{hopText}}</div>
    </div>
    <button type="button" onClick="{{toggleWhy}}" aria-pressed="{{whyPressed}}" aria-label="Show routing chips" style="{{whyStyle}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3v12M18 9v12M6 15a3 3 0 1 0 0 6 3 3 0 0 0 0-6ZM18 3a3 3 0 1 0 0 6 3 3 0 0 0 0-6ZM6 9a6 6 0 0 0 6 6h3"></path></svg>
    </button>
  </div>

  <div style="height: 100%; overflow-y: auto; padding: 124px 12px 160px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px">
    <sc-for list="{{msgs}}" as="m" hint-placeholder-count="4">
      <div style="display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; padding: 8px 4px">
        <span style="{{m.av}}">{{m.initials}}</span>
        <div style="min-width: 0; display: flex; flex-direction: column; gap: 3px">
          <div style="display: flex; gap: 8px; align-items: baseline"><span style="font-size: 14px; font-weight: 700; color: var(--fg-strong)">{{m.who}}</span><span style="font-size: 12px; color: var(--muted)">{{m.time}}</span></div>
          <p style="margin: 0">{{m.text}}</p>
          <sc-if value="{{showWhy}}" hint-placeholder-val="{{ true }}">
            <div style="display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px">
              <sc-for list="{{m.chips}}" as="c" hint-placeholder-count="2"><span style="{{c.style}}">{{c.text}}</span></sc-for>
            </div>
          </sc-if>
        </div>
      </div>
    </sc-for>
    <sc-if value="{{hasTyping}}" hint-placeholder-val="{{ false }}">
      <div style="padding: 4px 48px; font-size: 13px; color: var(--info)">{{typing}} is replying…</div>
    </sc-if>
  </div>

  <div style="position: absolute; left: 12px; right: 12px; bottom: 16px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; gap: 6px; overflow-x: auto">
      <sc-for list="{{mentions}}" as="b" hint-placeholder-count="3">
        <button type="button" onClick="{{b.add}}" style="flex: none; height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--border); background: var(--glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); font-size: 14px; color: var(--fg)">@{{b.name}}</button>
      </sc-for>
    </div>
    <div style="display: flex; align-items: center; gap: 6px; height: 54px; padding: 0 6px 0 16px; border-radius: 27px; background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--border); box-shadow: var(--shadow)">
      <label for="pr-compose" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Message serving-plan</label>
      <input id="pr-compose" type="text" value="{{draft}}" onChange="{{onDraft}}" onKeyDown="{{onKey}}" placeholder="{{hint}}" style="flex: 1; min-width: 0; height: 44px; border: 0; outline: 0; background: transparent; font: inherit; font-size: 16px; color: var(--fg)">
      <button type="button" onClick="{{send}}" aria-label="Send" style="{{sendStyle}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
      </button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentWillUnmount() { (this._timers || []).forEach((t) => clearTimeout(t)); }
  later(ms, fn) { this._timers = this._timers || []; this._timers.push(setTimeout(fn, ms)); }
  st() {
    return Object.assign({ why: true, draft: '', typing: null, hop: 1, clock: 45, msgs: [
      { who: 'owner', time: '09:41', text: 'Can the new model fit on our two 48 GB cards? @research pull the numbers.', chips: [['wake', '→ research · @mention'], ['quiet', 'serving · observe 0.71'], ['dim', 'ops · ignore']] },
      { who: 'research', time: '09:43', text: 'Weights are 70 GB at 8-bit, leaving about 26 GB for KV cache. @serving enough for 16k at batch 2.', chips: [['wake', '→ serving · @mention · hop 1']] },
      { who: 'serving', time: '09:44', text: 'Then one replica fits. I can draft the deployment once you approve the inference namespace.', chips: [['needs', '→ you · needs you'], ['quiet', 'ops · observe 0.52']] }
    ] }, this.state || {});
  }

  send() {
    const s = this.st();
    const text = (s.draft || '').trim();
    if (!text) return;
    const bots = ['serving', 'research', 'ops'];
    const mentioned = bots.filter((b) => new RegExp('@' + b + '\\b', 'i').test(text));
    const woken = mentioned.length ? mentioned : ['serving'];
    const chips = woken.map((b) => ['wake', '→ ' + b + ' · ' + (mentioned.length ? '@mention' : 'lead')]).concat(bots.filter((b) => woken.indexOf(b) < 0).map((b) => ['dim', b + ' · ignore']));
    const clock = s.clock + 1;
    this.setState({ draft: '', hop: 0, clock: clock, msgs: s.msgs.concat([{ who: 'owner', time: '09:' + clock, text: text, chips: chips }]) });
    const replies = { serving: 'On it. I will put that in the deployment thread and ask before applying.', research: 'I can measure that in about 15 minutes. Starting now.', ops: 'Noted. I will add it to tonight’s backup and cert checks.' };
    woken.forEach((b, i) => {
      this.later(700 + i * 1300, () => this.setState({ typing: b }));
      this.later(1700 + i * 1300, () => {
        const cur = this.st();
        this.setState({ typing: null, clock: cur.clock + 1, msgs: cur.msgs.concat([{ who: b, time: '09:' + (cur.clock + 1), text: replies[b], chips: [['quiet', '→ room · reply']] }]) });
      });
    });
  }

  renderVals() {
    const s = this.st();
    const dark = (this.props.theme ?? 'light') === 'dark';
    const C = { owner: ['YOU', 'var(--fg-strong)', 'var(--screen)'], serving: ['SE', '#c2410c', '#ffffff'], research: ['RE', '#0e7490', '#ffffff'], ops: ['OP', '#4d7c0f', '#ffffff'] };
    const base = 'font-size: 12px; line-height: 1; padding: 6px 9px; border-radius: 999px; ';
    const chipStyle = { wake: base + 'background: var(--primary-wash); color: var(--primary); font-weight: 700', needs: base + 'background: var(--warn-wash); color: var(--warn); font-weight: 700', quiet: base + 'border: 1px solid var(--border); color: var(--muted)', dim: base + 'border: 1px solid var(--border); color: var(--subtle)' };
    const msgs = s.msgs.map((m) => ({
      who: m.who === 'owner' ? 'You' : m.who, time: m.time, text: m.text, initials: C[m.who][0],
      av: 'width: 34px; height: 34px; border-radius: 11px; background: ' + C[m.who][1] + '; color: ' + C[m.who][2] + '; display: grid; place-items: center; font-size: ' + (m.who === 'owner' ? 9.5 : 11.5) + 'px; font-weight: 700',
      chips: m.chips.map((c) => ({ text: c[1], style: chipStyle[c[0]] }))
    }));
    const draft = s.draft || '';
    return {
      themeClass: dark ? 'dark' : '',
      msgs: msgs, showWhy: s.why, whyPressed: String(s.why),
      toggleWhy: () => this.setState({ why: !this.st().why }),
      whyStyle: 'width: 44px; height: 44px; border: 0; border-radius: 22px; display: grid; place-items: center; ' + (s.why ? 'background: var(--primary-wash); color: var(--primary)' : 'background: transparent; color: var(--muted)'),
      hopText: 'hop ' + s.hop + ' of 3',
      hasTyping: !!s.typing, typing: s.typing || '',
      mentions: ['serving', 'research', 'ops'].map((b) => ({ name: b, add: () => this.setState({ draft: (this.st().draft || '').replace(/\s*$/, '') + ((this.st().draft || '') ? ' ' : '') + '@' + b + ' ' }) })),
      draft: draft, onDraft: (e) => this.setState({ draft: e.target.value }),
      onKey: (e) => { if (e.key === 'Enter') { e.preventDefault(); this.send(); } },
      send: () => this.send(),
      hint: 'Message · @name wakes a bot',
      sendStyle: 'flex: none; width: 44px; height: 44px; border: 0; border-radius: 22px; display: grid; place-items: center; ' + (draft.trim() ? 'background: var(--fg-strong); color: var(--screen)' : 'background: var(--hover); color: var(--subtle)')
    };
  }
}
</script>
</body>
</html>
