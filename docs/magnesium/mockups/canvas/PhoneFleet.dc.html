<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fleet on the phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.ph{--screen:#fcfcfc;--card:#ffffff;--fg:#27272a;--fg-strong:#18181b;--muted:#71717b;--subtle:#a1a1aa;--border:#e4e4e7;--hover:#f4f4f5;--primary:#1b4ed8;--on-primary:#ffffff;--warn:#b45309;--warn-wash:#fffbeb;--input:#4f46e5;--info:#2563eb;--ok:#15803d;--err:#dc2626;--plan:#7c3aed;--glass:rgba(252,252,252,.86);--scrim:rgba(0,0,0,.28);--shadow:0 8px 28px rgba(0,0,0,.10);color-scheme:light}
.ph.dark{--screen:#0a0a0a;--card:#111111;--fg:#f5f5f5;--fg-strong:#ffffff;--muted:#8a8a8a;--subtle:#5c5c5c;--border:#1f1f1f;--hover:#161616;--primary:#346bf1;--on-primary:#ffffff;--warn:#fbbf24;--warn-wash:#1f1705;--input:#a5b4fc;--info:#60a5fa;--ok:#4ade80;--err:#f87171;--plan:#c4b5fd;--glass:rgba(10,10,10,.86);--scrim:rgba(0,0,0,.6);--shadow:0 8px 28px rgba(0,0,0,.6);color-scheme:dark}
.ph button{font:inherit;color:inherit;cursor:pointer}
.ph :focus-visible{outline:2px solid var(--primary);outline-offset:2px}
</style>
</helmet>
<div class="ph {{themeClass}}" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: var(--screen); color: var(--fg); font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 1.45">
  <div style="height: 100%; overflow-y: auto; padding: 54px 16px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: flex-end; gap: 10px">
      <a href="Phone.dc.html" aria-label="Back to Home" style="width: 44px; height: 44px; margin-left: -12px; display: grid; place-items: center; color: var(--primary)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>
      </a>
    </div>
    <div>
      <h1 style="margin: 0; font-size: 32px; line-height: 1.1; font-weight: 700; color: var(--fg-strong); letter-spacing: -0.02em">Fleet</h1>
      <p style="margin: 4px 0 0; font-size: 14px; color: var(--muted)">6 machines · 1 offline · 13 running</p>
    </div>
    <div role="group" aria-label="Filter" style="display: flex; padding: 3px; border-radius: 12px; background: var(--hover)">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
        <button type="button" aria-pressed="{{f.pressed}}" onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button>
      </sc-for>
    </div>
    <div style="background: var(--card); border: 1px solid var(--border); border-radius: 20px; overflow: hidden">
      <sc-for list="{{shown}}" as="m" hint-placeholder-count="6">
        <button type="button" onClick="{{m.open}}" style="{{m.rowStyle}}">
          <span style="{{m.dot}}"></span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; text-align: left">
            <span style="display: flex; align-items: baseline; gap: 8px"><span style="font-size: 16px; font-weight: 700; color: var(--fg-strong)">{{m.name}}</span><span style="font-size: 12.5px; color: var(--muted)">{{m.kind}}</span></span>
            <span style="font-size: 13px; color: var(--muted)">{{m.line}}</span>
            <span style="display: block; height: 4px; border-radius: 2px; background: var(--hover); overflow: hidden"><span style="{{m.bar}}"></span></span>
          </span>
          <sc-if value="{{m.hasNeeds}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12.5px; font-weight: 700; color: var(--warn)">{{m.needs}}</span></sc-if>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--subtle)" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
        </button>
      </sc-for>
    </div>
    <p style="margin: 0; font-size: 12px; color: var(--subtle); text-align: center">Example data · no backend</p>
  </div>

  <sc-if value="{{hasSheet}}" hint-placeholder-val="{{ false }}">
    <button type="button" onClick="{{close}}" aria-label="Close" style="position: absolute; inset: 0; border: 0; background: var(--scrim); padding: 0"></button>
    <div role="dialog" aria-label="{{sel.name}}" style="position: absolute; left: 0; right: 0; bottom: 0; background: var(--card); border-radius: 24px 24px 0 0; box-shadow: var(--shadow); padding: 8px 16px 28px; display: flex; flex-direction: column; gap: 12px">
      <span style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: var(--border)"></span>
      <div style="display: flex; align-items: center; gap: 10px">
        <div style="flex: 1">
          <h2 style="margin: 0; font-size: 20px; font-weight: 700; color: var(--fg-strong)">{{sel.name}}</h2>
          <div style="font-size: 13px; color: var(--muted)">{{sel.route}}</div>
        </div>
        <span style="{{sel.pill}}">{{sel.state}}</span>
      </div>
      <div style="display: flex; flex-direction: column">
        <sc-if value="{{sel.isEmpty}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; color: var(--muted)">{{sel.empty}}</p></sc-if>
        <sc-for list="{{sel.items}}" as="it" hint-placeholder-count="2">
          <a href="{{it.href}}" style="display: flex; align-items: center; gap: 10px; min-height: 52px; border-top: {{it.border}}">
            <span style="{{it.av}}">{{it.initials}}</span>
            <span style="flex: 1; min-width: 0; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{it.title}}</span>
            <span style="{{it.statusStyle}}">{{it.label}}</span>
          </a>
        </sc-for>
      </div>
      <sc-if value="{{sel.online}}" hint-placeholder-val="{{ true }}">
        <button type="button" onClick="{{launch}}" style="height: 50px; border: 0; border-radius: 14px; background: var(--primary); color: var(--on-primary); font-size: 16px; font-weight: 700">{{launchText}}</button>
      </sc-if>
      <sc-if value="{{sel.offline}}" hint-placeholder-val="{{ false }}">
        <button type="button" onClick="{{close}}" style="height: 50px; border: 1px solid var(--border); border-radius: 14px; background: var(--card); font-size: 16px; font-weight: 500">Reconnect when it is back</button>
      </sc-if>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  st() { return Object.assign({ filter: 'all', sel: null, launched: {} }, this.state || {}); }

  renderVals() {
    const s = this.st();
    const dark = (this.props.theme ?? 'light') === 'dark';
    const P = { serving: ['SE', '#c2410c'], research: ['RE', '#0e7490'], ops: ['OP', '#4d7c0f'], scribe: ['SC', '#be185d'], reviewer: ['RV', '#475569'] };
    const color = { approval: 'var(--warn)', input: 'var(--input)', working: 'var(--info)', plan: 'var(--plan)', done: 'var(--ok)', failed: 'var(--err)', idle: 'var(--muted)' };
    const human = { approval: 1, input: 1, plan: 1, failed: 1 };
    const base = [
      { name: 'workstation', kind: 'laptop', route: 'This machine', state: 'Connected', health: 'ok', load: 31, tags: [], items: [['reviewer', 'Review PR #48: room router', 'working', 'Working'], ['research', 'Which eval set for the long-context run?', 'input', 'Input']] },
      { name: 'gpu-a', kind: '2 GPUs', route: 'via LAN · 2 ms', state: 'Connected', health: 'ok', load: 78, tags: ['gpu'], items: [['serving', 'Draft the serving deployment', 'approval', 'Approval'], ['research', 'KV-cache sweep, batch 4', 'working', '62%']] },
      { name: 'gpu-b', kind: '4 GPUs', route: 'via LAN · 3 ms', state: 'Connected', health: 'ok', load: 0, tags: ['gpu'], items: [], empty: 'Idle. 4 GPUs free.' },
      { name: 'enclave-1', kind: 'VM', route: 'via Tailscale · 9 ms', state: 'Connected', health: 'ok', load: 17, tags: [], items: [['ops', 'Rotate KB backups to the new pool', 'plan', 'Plan ready'], ['ops', 'Check certificate expiry', 'working', 'Working']] },
      { name: 'kb-host', kind: 'VM', route: 'via Tailscale · 11 ms', state: 'Degraded', health: 'warn', load: 12, tags: [], items: [['scribe', 'Index the October papers', 'working', '31 of 58'], ['scribe', 'Nightly dream cycle', 'failed', 'Failed']] },
      { name: 'nas', kind: 'storage', route: 'via LAN · no answer', state: 'Offline', health: 'off', load: 0, tags: [], items: [], empty: 'Last seen 12 minutes ago.' }
    ];
    const machines = base.map((m) => {
      const extra = s.launched[m.name] ? [['research', 'New session', 'working', 'Starting']] : [];
      const items = m.items.concat(extra).map((it, i) => ({
        title: it[1], label: it[3], initials: P[it[0]][0], href: it[1] === 'Nightly dream cycle' ? 'Phone.dc.html' : 'PhoneSession.dc.html',
        border: i === 0 ? '0' : '1px solid var(--border)',
        av: 'flex: none; width: 28px; height: 28px; border-radius: 9px; background: ' + P[it[0]][1] + '; color: #ffffff; display: grid; place-items: center; font-size: 10px; font-weight: 700',
        statusStyle: 'flex: none; font-size: 13px; font-weight: ' + (human[it[2]] ? 700 : 500) + '; color: ' + color[it[2]]
      }));
      const needs = m.items.filter((it) => human[it[2]]).length;
      return Object.assign({}, m, {
        items: items, needs: needs + ' need you', hasNeeds: needs > 0,
        line: m.health === 'off' ? 'Offline for 12m' : (m.tags.indexOf('gpu') >= 0 ? 'GPU ' + m.load + '% · ' : 'CPU ' + m.load + '% · ') + items.length + ' running',
        bar: 'display: block; height: 4px; width: ' + m.load + '%; background: ' + (m.load > 75 ? 'var(--warn)' : 'var(--fg)') + '; opacity: .7',
        dot: 'flex: none; width: 10px; height: 10px; border-radius: ' + (m.health === 'off' ? '3px' : '50%') + '; background: ' + (m.health === 'ok' ? 'var(--ok)' : m.health === 'warn' ? 'var(--warn)' : 'var(--err)'),
        rowStyle: 'width: 100%; display: flex; align-items: center; gap: 12px; min-height: 76px; padding: 10px 14px; border: 0; border-top: 1px solid var(--border); background: transparent; text-align: left; opacity: ' + (m.health === 'off' ? 0.6 : 1),
        open: () => this.setState({ sel: m.name }),
        isEmpty: items.length === 0, empty: m.empty || '', online: m.health !== 'off', offline: m.health === 'off',
        pill: 'font-size: 12.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--hover); color: ' + (m.health === 'ok' ? 'var(--ok)' : m.health === 'warn' ? 'var(--warn)' : 'var(--err)')
      });
    });
    const shown = machines.filter((m) => s.filter === 'all' || (s.filter === 'needs' ? m.hasNeeds : m.tags.indexOf('gpu') >= 0));
    if (shown.length) shown[0] = Object.assign({}, shown[0], { rowStyle: shown[0].rowStyle.replace('border-top: 1px solid var(--border)', 'border-top: 0') });
    const filters = [['all', 'All'], ['needs', 'Needs you'], ['gpu', 'GPU']].map((f) => ({
      label: f[1], pressed: String(s.filter === f[0]), pick: () => this.setState({ filter: f[0] }),
      style: 'flex: 1; min-height: 36px; border: 0; border-radius: 9px; font-size: 14px; ' + (s.filter === f[0] ? 'background: var(--card); color: var(--fg-strong); font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.08)' : 'background: transparent; color: var(--muted); font-weight: 500')
    }));
    const sel = machines.filter((m) => m.name === s.sel)[0] || machines[0];
    return {
      themeClass: dark ? 'dark' : '',
      filters: filters, shown: shown,
      hasSheet: !!s.sel, sel: sel,
      close: () => this.setState({ sel: null }),
      launchText: s.launched[sel.name] ? 'Launched research here' : 'Launch a session here',
      launch: () => { const l = Object.assign({}, this.st().launched); l[sel.name] = true; this.setState({ launched: l }); }
    };
  }
}
</script>
</body>
</html>
