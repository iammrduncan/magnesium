<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Magnesium mocks</title>
    <style>
      :root {
        --ground: #f4f4f5;
        --fg: #18181b;
        --muted: #71717b;
        --border: #e4e4e7;
        --surface: #ffffff;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --ground: #09090b;
          --fg: #f4f4f5;
          --muted: #a1a1aa;
          --border: #27272a;
          --surface: #18181b;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --ground: #09090b;
        --fg: #f4f4f5;
        --muted: #a1a1aa;
        --border: #27272a;
        --surface: #18181b;
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: var(--ground);
        color: var(--fg);
        font:
          14px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px 20px;
        padding: 10px 16px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
      }
      h1 {
        margin: 0;
        font-size: 16px;
      }
      header p {
        margin: 0;
        flex: 1 1 260px;
        color: var(--muted);
      }
      label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      select,
      input {
        font: inherit;
      }
      #canvas {
        position: relative;
        margin: 24px 16px 64px;
      }
      .board {
        position: absolute;
      }
      .board a {
        display: block;
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 12px;
        text-decoration: none;
        white-space: nowrap;
      }
      .board a:hover {
        color: var(--fg);
      }
      .frame {
        overflow: hidden;
        border: 1px solid var(--border);
        background: var(--surface);
      }
      .frame iframe {
        border: 0;
        transform-origin: 0 0;
        display: block;
      }
      .note {
        position: absolute;
        font-weight: 700;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Magnesium mocks</h1>
      <p>
        The UX target (D9). Every board works: click through it, or open one alone from its name.
      </p>
      <label
        >Theme
        <select id="theme">
          <option>light</option>
          <option>dark</option>
        </select></label
      >
      <label>Zoom <input id="zoom" type="range" min="10" max="100" step="5" value="25" /></label>
    </header>
    <main id="canvas" aria-label="Boards"></main>
    <script type="module">
      const canvas = document.getElementById("canvas");
      const theme = document.getElementById("theme");
      const zoom = document.getElementById("zoom");
      const index = await (await fetch("canvas.json")).json();
      const params = new URLSearchParams(location.search);
      theme.value = params.get("theme") === "dark" ? "dark" : "light";
      zoom.value = params.get("zoom") || zoom.value;

      const draw = () => {
        const scale = Number(zoom.value) / 100;
        const query = theme.value === "dark" ? "?theme=dark" : "";
        document.documentElement.dataset.theme = theme.value;
        const boards = Object.entries(index.boards);
        const notes = Object.values(index.notes || {});
        const top = Math.min(0, ...notes.map((note) => note.y));
        const right = Math.max(...boards.map(([, b]) => b.x + b.w));
        const bottom = Math.max(...boards.map(([, b]) => b.y + b.h));
        canvas.style.width = `${right * scale}px`;
        canvas.style.height = `${(bottom - top) * scale + 40}px`;
        canvas.replaceChildren(
          ...notes.map((note) => {
            const element = document.createElement("div");
            element.className = "note";
            element.textContent = note.text;
            element.style.left = `${note.x * scale}px`;
            element.style.top = `${(note.y - top) * scale}px`;
            element.style.fontSize = `${72 * scale}px`;
            return element;
          }),
          ...index.order.map((file) => {
            const board = index.boards[file];
            const element = document.createElement("section");
            element.className = "board";
            element.style.left = `${board.x * scale}px`;
            element.style.top = `${(board.y - top) * scale - 24}px`;
            const link = document.createElement("a");
            link.href = file + query;
            link.target = "_blank";
            link.textContent = board.title || file;
            const frame = document.createElement("div");
            frame.className = "frame";
            frame.style.width = `${board.w * scale}px`;
            frame.style.height = `${board.h * scale}px`;
            frame.style.borderRadius = `${(board.radius || 0) * scale}px`;
            const iframe = document.createElement("iframe");
            iframe.title = board.title || file;
            iframe.loading = "lazy";
            iframe.src = file + query;
            iframe.width = board.w;
            iframe.height = board.h;
            iframe.style.transform = `scale(${scale})`;
            frame.append(iframe);
            element.append(link, frame);
            return element;
          }),
        );
      };
      const remember = () => {
        const next = new URLSearchParams({ theme: theme.value, zoom: zoom.value });
        history.replaceState(null, "", `?${next}`);
        draw();
      };
      theme.addEventListener("change", remember);
      zoom.addEventListener("change", remember);
      draw();
    </script>
  </body>
</html>
