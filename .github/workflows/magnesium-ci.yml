# magnesium: the fork's one CI workflow (doc 11). Upstream's workflows are
# deleted by scripts/strip-upstream.ts.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Strip and rename are applied
        run: |
          node scripts/strip-upstream.ts --check
          node scripts/rename-upstream.ts --check

      # Generic patterns only: the lab denylist is private. The base is the watermark in
      # upstream-changelog.md, fetched alone because the checkout is shallow.
      - name: Public content
        run: |
          base=$(sed -n 's/.*fully inspected:\*\* `\([0-9a-f]\{40\}\)`.*/\1/p' upstream-changelog.md)
          git fetch --no-tags --depth=1 origin "$base"
          node scripts/check-public.ts

      - name: Typecheck
        run: vp run -r --concurrency-limit 2 typecheck

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      # v0.1.0's server browser tests drive a headless Chromium, as upstream's CI installs it.
      - name: Install Chromium for server browser tests
        run: node apps/server/node_modules/playwright-core/cli.js install --with-deps --only-shell chromium

      - name: Test
        run: vp run -r test
        env:
          # The web build reads GITHUB_REPOSITORY for desktop release links, which in this
          # fork's CI is the fork; upstream's tests expect its default. Magnesium has no
          # desktop releases (D10).
          T3CODE_DESKTOP_UPDATE_REPOSITORY: pingdotgg/t3code

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Build server and web
        run: vp run --filter t3 build

  image:
    # Both architectures: workloads it attaches to may run on arm64.
    name: Spoke image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Build the image (goal 25)
        run: |
          docker build -f magnesium/deploy/container/Containerfile \
            --build-arg MAGNESIUM_COMMIT="${GITHUB_SHA::10}" -t magnesium-spoke:ci .

      - name: It serves as a pod would run it
        run: |
          docker run -d --name spoke --user 10001:10001 --cap-drop ALL \
            --security-opt no-new-privileges --read-only --tmpfs /tmp \
            --mount type=tmpfs,destination=/home/agent,tmpfs-mode=0777 \
            -e HOME=/home/agent -e MAGNESIUM_MACHINE=ci-spoke -p 127.0.0.1:3773:3773 \
            magnesium-spoke:ci
          for _ in $(seq 1 60); do
            # A server that takes the connection but never answers fails the step, not the job's clock.
            if curl -fsS --max-time 5 http://127.0.0.1:3773/.well-known/t3/environment > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS --max-time 5 http://127.0.0.1:3773/.well-known/t3/environment
          echo
          # A fence works with no capabilities, and the pairing token stays out of the log.
          docker exec spoke magnesium-fence --probe
          docker exec spoke magnesium-release status
          if docker logs spoke 2>&1 | grep -qi "token"; then echo "the log holds a token" >&2; exit 1; fi

      - name: It attaches inside a workload's own container (D59)
        run: |
          # As an init container would, as a non-root uid: copy the bundle into a
          # world-writable volume (like an emptyDir) that the workload mounts.
          docker volume create bundle
          docker run --rm --user 0 -v bundle:/bundle --entrypoint chmod magnesium-spoke:ci 0777 /bundle
          docker run --rm --user 10001:10001 -v bundle:/bundle \
            --entrypoint /opt/magnesium-portable/bin/magnesium-bundle-copy magnesium-spoke:ci /bundle
          # A workload image with no Node, git or Python, as a non-root uid. Its own
          # command exits 7 on TERM, which the container must end with.
          docker run -d --name workload --user 10001:10001 --cap-drop ALL \
            --security-opt no-new-privileges \
            -v bundle:/opt/magnesium-portable:ro \
            --mount type=tmpfs,destination=/home/work,tmpfs-mode=0777 \
            -e MAGNESIUM_HOME=/home/work -e MAGNESIUM_MACHINE=ci-attached \
            -e MAGNESIUM_WORKLOAD=ci-workload -p 127.0.0.1:3774:3773 \
            docker.io/library/debian:bookworm-slim@sha256:7c7b2c966bc9ee8cedfeef67e0e279108992c77681fa595db4a9d65c06ccc587 \
            /opt/magnesium-portable/bin/magnesium-attach -- \
            sh -c 'trap "exit 7" TERM; echo workload up; while :; do sleep 1; done'
          up() {
            for _ in $(seq 1 60); do
              if curl -fsS --max-time 5 http://127.0.0.1:3774/.well-known/t3/environment > /dev/null; then return 0; fi
              sleep 2
            done
            return 1
          }
          up
          docker logs workload 2>&1 | grep -q "workload up"
          # The bundle fills the gaps: git for agents, and the fence through its own Python.
          docker exec workload sh -c 'PATH="$PATH:/opt/magnesium-portable/bin" git --version'
          docker exec -e MAGNESIUM_PYTHON=/opt/magnesium-portable/python/bin/python3 workload \
            /opt/magnesium-portable/bin/magnesium-fence --probe
          # The server starts again when it stops, and the workload never notices.
          # Only the server's Node, by how its command starts: this shell's own
          # command line holds the pattern too.
          docker exec workload sh -c 'for p in /proc/[0-9]*; do
            case "$(tr "\0" " " < "$p/cmdline" 2>/dev/null)" in
              /opt/magnesium-portable/node/bin/node*) kill "${p#/proc/}" ;;
            esac; done'
          sleep 3
          up
          [ "$(docker inspect -f '{{.State.Running}}' workload)" = true ]
          # Stopping the container stops the workload, with its own exit status.
          docker stop -t 20 workload
          [ "$(docker inspect -f '{{.State.ExitCode}}' workload)" = 7 ]
          if docker logs workload 2>&1 | grep -qi "token"; then echo "the log holds a token" >&2; exit 1; fi

      - name: Logs on failure
        if: failure() || cancelled()
        run: |
          docker logs spoke || true
          docker logs workload || true
          # The servers' own logs and processes, for one that started but never answered.
          docker top spoke || true
          docker exec spoke sh -c 'tail -n 300 "$HOME"/.magnesium/userdata/logs/*.log' || true
          docker top workload || true
          docker exec workload sh -c 'tail -n 300 /home/work/.magnesium/userdata/logs/*.log' || true
